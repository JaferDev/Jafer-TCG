<!DOCTYPE html>
<html>
    <head>
        <title>Jafer's TCG</title>
        <link rel="stylesheet" href="Styles.css">
    </head>
    <body id="Home">
        <div class="Navbar">
            <h1 class="PageHead">Jafer's TCG</h1>
            <button class="TopButton" onclick="GoHome()">Home</button>
        </div>
        <div class="RegisterContainer">
            <h1 class="Subheading">REGISTER</h1>
            <input class="LongInput" placeholder="Email" type="email" id="email"><br><br>
            <input class="LongInput" placeholder="Username" type="text" id="username"><br><br>
            <input class="LongInput" placeholder="Date of Birth" type="date" id="dob"><br><br>
            <input class="LongInput" placeholder="Password" type="password" id="password"><br><br>
            <input class="LongInput" placeholder="Confirm Password" type="password" id="confPassword"><br><br>
        </div>

        <button class="LongButton" onclick=Register()>LOGIN</button>
        
        <script src="LoginHandler.js"></script>
    </body>
</html>
