<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet", href="Styles.css">
        <meta charset="UTF-8" />
        <title>Jafer's TCG</title>
    </head>
    <body>
        <!--LOGIN BOX-->
        <div class="InputContainerParent">
            <div class="InputContainer">
                <h2 class="Subheading">LOGIN</h2>
                <h3 class="Caption">(Score Saved)</h3>
                <label class="Caption">Username</label>
                <input class="LongInput" type="text" id="loginUsername" name="username"><br><br>
                <label class="Caption">Password</label>
                <input class="LongInput" type="password" id="loginPassword" name="password"><br><br>
                <button class="LongButton" type="submit" onclick="ConfirmLogin()">Confirm</button>
            </div>
            <!--GUEST BOX-->
            <div class="InputContainer">
                <h2 class="Subheading">GUEST</h2>
                <h3 class="Caption">(Score not saved)</h3>
                <label class="Caption">Username</label>
                <input class="LongInput" type="text" id="guestUsername"><br><br><br><br>
                <button class="LongButton" onclick="AddGuest()">Confirm</button>
            </div>
        </div>
        
        <button class="LongButton" onclick="GoChooseCharacter()">PLAY</button>

        <script src="app.js"></script>        
    </body>
</html>
