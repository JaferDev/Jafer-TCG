<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet", href="../Styles.css">
        <meta charset="UTF-8" />
        <title>Jafer's TCG</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body id="GameFocused">
        <div class="Navbar">
            <button class="TopButton" onclick="ChangePage(0)">Home</button>
            <button class="TopButton" onclick="ChangePage(2)">High Scores</button>
        </div>
        <div id="Container">
            <div id="TopCards" class="TopCards"></div>
            <div id="ActiveCards" class="ActiveCards">

                <div class="EnemyCard" id="enemyActive"></div>
            </div>
            <div id="BottomCards" class="BottomCards"></div>
        </div>
        
        <canvas class="GameCanvas" id="GameCanvas"></canvas>
        
        <script src="../JavaScript/Redirect.js"></script>
        <script src="../JavaScript/Game.js" type="module"></script>
    </body>
