<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet", href="../Styles1.css">
        <meta charset="UTF-8" />
        <title>Jafer's TCG</title>
    </head>
    <body id="Game">
        <div class="CardContainer">
            <div class="Card">
                <div class="CardHeadContainer">
                    <img src="../Sprites/UI/Wind.png" class="CardHeadType">
                    <p class="CardHead">Paper Sheet</p>
                    <p class="CardHP">HP 70</p>
                </div>    
                <img src="../Sprites/CharacterCards/Character Images/Axle.png" class="CardImage">
                <div class="AtkInfoContainer">
                    <div class="Atk">
                        <div class="AtkHead">
                            <img src="../Sprites/UI/Wind.png" class="AtkType">
                            <p class="AtkName">Catch</p>
                            <p class="AtkHP">13</p>       
                        </div>
                        <p class="AtkDesc">Catches enemy by surrounding enemy with itself</p>
                    </div>
                    <div class="Atk">
                        <div class="AtkHead">
                            <img src="../Sprites/UI/Wind.png" class="AtkType">
                            <img src="../Sprites/UI/Wind.png" class="AtkType">
                            <img src="../Sprites/UI/Wind.png" class="AtkType">
                            <p class="AtkName">Paper Cuts</p>
                            <p class="AtkHP">42</p>
                        </div>
                        <p class="AtkDesc">Gives enemy many different paper cuts. Ouch!</p>
                    </div>
                    <div class="DefaultDetails">
                        <div class="HalfDetail">
                            <p class="SmallDetail">Weakness</p>
                            <img src="../Sprites/UI/Ground.png" class="AtkType">
                            <p class="SmallDetail">x 2</p>
                        </div>
                        <div class="HalfDetail">
                            <p class="SmallDetail">Reactions</p>
                            <img src="../Sprites/UI/Fire.png" class="AtkType">
                            <img src="../Sprites/UI/Ice.png" class="AtkType">
                            <img src="../Sprites/UI/Water.png" class="AtkType">
                            <p class="SmallDetail">x 1.1</p>
                        </div>
                    </div>
                </div> 
                <div class="CreditsContainer">
                    <p class="Credits">Idea By: Baqir Hussain</p>
                    <p class="Credits">Art By: Jafer Hussain</p>
                </div>
            </div>
        </div>
    </body>
</html>
