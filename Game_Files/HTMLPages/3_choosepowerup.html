<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet", href="../Styles.css">
        <meta charset="UTF-8" />
        <title>Jafer's TCG</title>
    </head>
    <body id="Game">
        <div class="Navbar">
            <button class="TopButton" onclick="GoChooseCharacter()">Characters</button>
            <h1 class="PageHeadLong">Choose 2 Powerups</h1>
            <button class="TopButton" onclick="GoHome()">Home</button>
        </div>
        <div class="PowerupCardContainer">
            <img class="CharacterCard" src="..\Sprites\PowerupCards\Jafer-TCG_Character Card.png" onclick="SelectPowerup(1)">
            <img class="CharacterCard" src="..\Sprites\PowerupCards\Jafer-TCG_Character Card copy.png" onclick="SelectPowerup(2)">
            <img class="CharacterCard" src="..\Sprites\PowerupCards\Jafer-TCG_Character Card copy 2.png" onclick="SelectPowerup(3)">
            <img class="CharacterCard" src="..\Sprites\PowerupCards\Jafer-TCG_Character Card copy 3.png" onclick="SelectPowerup(4)">
            <img class="CharacterCard" src="..\Sprites\PowerupCards\Jafer-TCG_Character Card copy 4.png" onclick="SelectPowerup(5)">
        </div>

        <button class="LongButton" onclick="ConfirmPowerupSelection()" id="ConfirmBtn">Confirm</button>

        <script src="../JavaScript/ChoicesHandler.js"></script>
    </body>
</html>
